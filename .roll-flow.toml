config_version = 1
repo_root = "/home/gig/local_repos/roll-flow"
rolling_branch = "develop"
stable_branch = "main"
roll_prefix = "roll/"
username = "gig"
hosts = []
roll_to_rolling_gates = [
    "cargo fmt --all --check",
    "cargo clippy --all-targets --locked -- -D warnings",
    "cargo test --locked",
]
rolling_to_main_gates = [
    "cargo update --workspace --locked",
    "cargo fmt --all --check",
    "cargo clippy --all-targets --locked -- -D warnings",
    "cargo build --locked",
    "cargo test --locked",
]
version_gate = true
tag_on_promote = true
push_tag = true
mode = "manage"
host_gates = []
clean_protect = []
pull_mode = "ff-only"
lazygit_command = "lazygit"

[host_active]
